<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Frends Video Editor</title>
<style>
body{margin:0;background:#0a1a3a;color:white;text-align:center;font-family:sans-serif;padding-bottom:70px;}
.header{padding:15px;background:#112a5c;font-size:20px;font-weight:bold;}
video{max-width:90%;margin:15px;border-radius:10px;border:2px solid #4fc3f7;}
.btn{background:#4fc3f7;color:#000;padding:10px 15px;margin:5px;border:none;border-radius:8px;font-weight:bold;}
input{margin:15px;color:white;}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;background:#112a5c;padding:12px 0;}
.bottom-nav a{color:white;text-decoration:none;font-size:13px;}
</style>
</head>
<body>
<div class="header">🎬 Video Editor</div>

<input type="file" id="videoUpload" accept="video/*">
<br>
<video id="player" controls></video>
<br>
<button class="btn" onclick="player.style.filter='grayscale(100%)'">B&W</button>
<button class="btn" onclick="player.style.filter='sepia(100%)'">Sepia</button>
<button class="btn" onclick="player.style.filter='brightness(120%)'">Bright</button>
<button class="btn" onclick="player.style.filter='none'">Normal</button>

<div class="bottom-nav">
<a href="home.html">🏠 Home</a>
<a href="reels.html">🎬 Reels</a>
<a href="video.html">🎥 Video</a>
<a href="photo.html">📷 Photo</a>
</div>

<script>
document.getElementById('videoUpload').onchange = e => {
  document.getElementById('player').src = URL.createObjectURL(e.target.files[0]);
}
</script>
</body>
</html>
