<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frends Home</title>
<style>
body{margin:0;font-family:sans-serif;background:#0a1a3a;color:white;padding-bottom:70px;}
.header{display:flex;align-items:center;padding:12px;background:#112a5c;}
.header img{width:40px;height:40px;border-radius:50%;margin-right:10px;}
.post-box{padding:15px;}
.post-box textarea{width:92%;height:80px;border-radius:10px;border:none;padding:10px;background:#1a2f5c;color:white;font-size:16px;}
.post-box button{margin-top:10px;width:95%;padding:12px;background:#00aaff;border:none;border-radius:10px;color:white;font-weight:bold;font-size:16px;}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;display:flex;justify-content:space-around;background:#112a5c;padding:12px 0;}
.bottom-nav button{background:none;border:none;color:white;font-size:13px;}
</style>
</head>
<body>

<div class="header">
<img src="https://i.ibb.co/5GzX5gL/user.png" alt="profile">
<h3>Ripon Islam</h3>
</div>

<div class="post-box">
<textarea placeholder="তোমার মনে কি?"></textarea><br>
<button>পোস্ট করুন</button>
</div>

<div class="bottom-nav">
<button>🏠 Home</button>
<button>💬 SMS</button>
<button>📞 Call</button>
<button>📷 Photo</button>
</div>

</body>
</html>
