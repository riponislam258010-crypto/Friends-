<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frends - কথা ফ্রী</title>
  <style>
    body {
      background: #0A1F44; /* ডিপ নেভি ব্লু */
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #112B5F;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 20px rgba(79, 195, 247, 0.3);
    }
    h1 { 
      color: #4FC3F7; 
      margin-bottom: 10px;
      font-size: 32px;
    }
    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: #0A1F44;
      color: white;
    }
    button {
      background: #4FC3F7;
      color: #0A1F44;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #03A9F4;
    }
    .free { 
      font-size: 12px; 
      margin-top: 15px; 
      color: #90CAF9; 
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Frends 💙</h1>
    <p>স্বাগতম</p>
    <input type="text" placeholder="ইমেইল বা ফোন নাম্বার">
    <input type="password" placeholder="পাসওয়ার্ড">
    <button>লগইন</button>
    <p class="free">SMS, কল, ফটো - সব ফ্রী</p>
  </div>
</body>
</html>
